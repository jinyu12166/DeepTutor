  empty_finish_nudged: "模型这一轮只有内部推理，已提示其继续执行。"

empty:
  empty_reply: "（空回复）"
  skipped_reply: "（已跳过）"
  question_fallback: "（问题）"
  user_answered: "学生回答："
  no_tool_traces: "本轮没有实际工具调用。"
  no_intermediate_trace: "没有可用的中间执行记录。"
